name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, graphql, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        working-directory: apps/${{ matrix.app }}
        run: npm install

      - name: Lint
        working-directory: apps/${{ matrix.app }}
        run: npm run lint

      - name: Testes
        working-directory: apps/${{ matrix.app }}
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build das imagens
        run: docker compose build
